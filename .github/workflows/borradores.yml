name: Borradores de vídeos (sin avisos al móvil)
# Lo lanza cron-job.org cada pocas horas. Guarda el registro de noticias y, si hay una buena y todavía no hay 3 borradores hoy,
# monta el vídeo completo y lo sube a la release «borradores». Tu PC lo baja con «npm run review».
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency: f1bot
jobs:
  borradores:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ github.token }}
      PIPER_BIN: ${{ github.workspace }}/tools/piper/piper
      PIPER_VOICE: voices/es_ES-davefx-medium.onnx
      OLLAMA_MODEL: qwen2.5:7b
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --no-save --no-package-lock --ignore-scripts fast-xml-parser@5
      - name: Noticias y registro (rápido)
        run: |
          node scripts/news/fetch.mjs
          node scripts/news/cluster.mjs
          node scripts/alertas.mjs
      - name: Elegir qué montar
        id: pick
        run: node scripts/borradores.mjs --pick
      - name: Guardar estado
        run: node scripts/bot/push-state.mjs "estado borradores" data/state/bot.json
      # Lo pesado (Chrome, voces, IA) solo si hay algo que montar: así las ejecuciones sin noticias duran ~1 minuto
      - if: steps.pick.outputs.ids != ''
        uses: ./.github/actions/setup-tools
      - if: steps.pick.outputs.ids != ''
        name: Montar vídeos
        run: |
          for id in $(echo "${{ steps.pick.outputs.ids }}" | tr ',' ' '); do
            node scripts/agents/make-reels.mjs --id="$id"
          done
      - if: steps.pick.outputs.ids != ''
        name: Subir borradores
        run: node scripts/borradores.mjs --upload
      - if: steps.pick.outputs.ids != ''
        name: Guardar estado (noticias vistas)
        run: node scripts/bot/push-state.mjs "estado" data/news/seen.json data/state/bot.json
