name: Hoy toca (mensaje diario a Telegram)
on:
  schedule:
    - cron: '15 17 * * *'   # 19:15 en horario de verano de Madrid
    - cron: '15 18 * * *'   # 19:15 en horario de invierno (el script solo envía entre las 19 y las 21 h de Madrid, una vez al día)
  workflow_dispatch:
permissions:
  contents: write
concurrency: f1bot
jobs:
  hoytoca:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node scripts/hoytoca.mjs
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
      - name: Guardar estado
        run: node scripts/bot/push-state.mjs "estado hoy toca" data/state/bot.json
