name: F1 reels diarios
on:
  schedule:
    - cron: '0 6 * * *'      # 06:00 UTC = 07:00 en Madrid (invierno)
  workflow_dispatch:
permissions:
  contents: write
concurrency: f1bot
jobs:
  reels:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PIPER_BIN: ${{ github.workspace }}/tools/piper/piper
      PIPER_VOICE: voices/es_ES-davefx-medium.onnx
      OLLAMA_MODEL: qwen2.5:7b
      MAX_PER_RUN: '1'               # 1 vídeo al día
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
      # Opcionales: si existen estos secretos se usa Claude (guion) y/o ElevenLabs (voz); si no, Ollama y Edge (gratis)
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-tools
      - run: npm run agents
      - run: npm run notify
      - name: Guardar estado
        run: |
          git config user.name "f1-reels-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/news/seen.json data/state/bot.json
          git diff --cached --quiet || (git commit -m "estado" && git pull --rebase -q && git push)
