name: Herramientas gratis (Node, Chrome, voz Piper, IA Ollama)
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with: {node-version: 22, cache: npm}
    - run: npm ci
      shell: bash
    - run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq libnss3 libdbus-1-3 libatk1.0-0 libasound2t64 libxrandr2 libxkbcommon-x11-0 libxfixes3 libxcomposite1 libxdamage1 libgbm-dev libcups2 libcairo2 libpango-1.0-0 libatk-bridge2.0-0 fonts-liberation
        mkdir -p tools voices
        curl -sSL https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_linux_x86_64.tar.gz | tar xz -C tools
        curl -sSL -o voices/es_ES-davefx-medium.onnx https://huggingface.co/rhasspy/piper-voices/resolve/main/es/es_ES/davefx/medium/es_ES-davefx-medium.onnx
        curl -sSL -o voices/es_ES-davefx-medium.onnx.json https://huggingface.co/rhasspy/piper-voices/resolve/main/es/es_ES/davefx/medium/es_ES-davefx-medium.onnx.json
        curl -fsSL https://ollama.com/install.sh | sh
        (ollama serve > /dev/null 2>&1 &)
        sleep 5
        ollama pull qwen2.5:3b
      shell: bash
